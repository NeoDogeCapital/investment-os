# Global scoring config
scoring:
  regime_thresholds:
    risk_on: 0.40
    risk_off: -0.40
  recency_decay_model: exponential  # exponential | linear
  min_sources_for_regime: 3         # minimum active sources required to compute regime
  staleness_hard_cutoff_days: 30    # research older than this is excluded entirely

# Dimension global weights (how much each dimension contributes to composite regime score)
dimension_global_weights:
  macro_regime: 0.30
  micro_levels: 0.20
  options_flow: 0.20
  timing: 0.30
