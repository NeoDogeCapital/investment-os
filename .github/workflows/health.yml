name: health-check
on:
  schedule: [{cron: '30 22 * * 1-5'}]   # after the post-close chain
  workflow_dispatch: {}
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q psycopg2-binary
      - id: check
        env: { DATABASE_URL: '${{ secrets.SUPABASE_DB_URL }}' }
        run: |
          python3 - <<'PY'
          import os, sys, psycopg2
          sys.path.insert(0, "scripts")
          from lib_market_date import us_market_date
          md = us_market_date()
          c = psycopg2.connect(os.environ["DATABASE_URL"]); cur = c.cursor()
          problems = []

          cur.execute("SELECT MAX(price_date) FROM ticker_price_history")
          d = cur.fetchone()[0]
          if d is None or (md - d).days > 1: problems.append(f"prices stale: latest {d}, market date {md}")

          cur.execute("SELECT MAX(stack_date)::date FROM regime_stack")
          d = cur.fetchone()[0]
          if d is None or (md - d).days > 4: problems.append(f"regime stack stale: latest {d}")

          cur.execute("SELECT MAX(score_date) FROM risk_scores")
          d = cur.fetchone()[0]
          if d is None or (md - d).days > 4: problems.append(f"risk scores stale: latest {d}")

          cur.execute("""SELECT model_name, ROUND(SUM(weight)*100,2) FROM model_holdings_snapshot h
                         WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM model_holdings_snapshot
                                                WHERE model_name = h.model_name)
                         GROUP BY model_name HAVING ABS(SUM(weight)-1) > 0.001""")
          for m, tot in cur.fetchall(): problems.append(f"{m} does not total 100% ({tot}%)")

          cur.execute("""SELECT job_name, status, market_date FROM job_runs j
                         WHERE run_at = (SELECT MAX(run_at) FROM job_runs WHERE job_name = j.job_name)
                           AND status = 'error'""")
          for j, s, d in cur.fetchall(): problems.append(f"job {j} last run errored ({d})")

          c.close()
          if problems:
              print("::error::HEALTH CHECK FAILED"); [print(" -", p) for p in problems]; sys.exit(1)
          print("✓ all health checks passed")
          PY
      - if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `Health check failed — ${new Date().toISOString().slice(0,10)}`,
              body: `The nightly health check failed. See the run log:\n${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            })
